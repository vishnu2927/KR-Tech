    <!-- Global JSON-LD Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "EducationalOrganization",
          "@id": "https://krtech.in/#organization",

            "https://github.com/krtech",
            "https://twitter.com/krtech_academy",
            "https://www.youtube.com/@krtech"
          ],
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Bengaluru",
            "addressRegion": "Karnataka",
            "addressCountry": "IN"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://krtech.in/#website",
          "url": "https://krtech.in",
          "name": "KR Tech",
          "publisher": {
            "@id": "https://krtech.in/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://krtech.in/courses?search={search_term_string}",
            "query-input": "required name=search_term_string"

        }
